[package]
edition = "2018"
name = "snd-fireface-ctl-service"
version = "0.1.0"
# For publishing.
authors = ["Takashi Sakamoto"]
description = """
Runtime implementation to control audio and music unit in IEEE 1394 bus which ALSA fireface driver
(snd-fireface) supports.
"""
license = "GPL-3.0-or-later"
publish = false

[dependencies]
glib = "0.20"
nix = { version = ">=0.24", features = ["signal"] }
hinawa = "0.12"
hitaki = "0.6"
alsactl = "0.7"
alsa-ctl-tlv-codec = "0.1"
ieee1212-config-rom = "0.1"
firewire-fireface-protocols = "0.2"
clap = { version = "4.5", features = ["derive"] }
runtime-core = { path = "../core" }
tracing = "0.1"
tracing-subscriber = "0.3"

[package.metadata.deb]
maintainer = "Local Build <claude@jakobvonrotz.com>"
section = "sound"
depends = "libalsa-gobject-local (>= 0.3.1), libhinawa4 (>= 4.0), libhitaki0 (>= 0.2), libglib2.0-0t64, libc6"
extended-description = "Exposes RME Fireface (400/800/UCX/802) mixer, routing and DSP parameters as ALSA control elements. Built from git main of alsa-project/snd-firewire-ctl-services."
assets = [["target/release/snd-fireface-ctl-service", "usr/bin/", "755"]]
